# =============================================================================
# NovelAgent 通用写作驱动配置
# -----------------------------------------------------------------------------
# 本文件由 drivers/generic_writer.py 读取。当前填入的是《极品医仙归来》的值，
# 因此「不改动、直接跑」即可复现原极品医仙驱动的行为（含断点续写旧日志）。
#
# 换下一本小说：复制本文件为  driver_config.<书名>.toml ，改下面标 ★ 的字段，
# 然后  python drivers/generic_writer.py --config driver_config.<书名>.toml
# 详见同目录 README.md。
# =============================================================================

# ---------------------------------------------------------------------------
# [project] 小说身份与目录（★ 换书必改：name）
# ---------------------------------------------------------------------------
[project]
# ★ 小说在 NovelAgent 工作区里的 projects 目录名（即 state.json 所在目录名）。
#   例如目录是 小说/projects/jipin-yixian ，这里就填 "jipin-yixian"。
name = "jipin-yixian"

# 工作区根目录（agent 代码仓库与 小说 仓库的父目录）。默认无需改。
base_dir = "D:/project/NovelAgent"

# 小说仓库内 projects 的相对路径（相对 base_dir）。默认无需改。
projects_rel = "小说/projects"

# ---------------------------------------------------------------------------
# [paths] 解释器与日志（★ 换书可改：log 建议改成新书专属名）
# ---------------------------------------------------------------------------
[paths]
# Python 解释器（需已装好 NovelAgent 依赖 / 或已 editable 安装 agent 包）。
# 留空则使用运行本脚本的解释器（sys.executable）。
python = "D:/env/python/python.exe"

# 运行日志（JSON，承载断点续写状态）。绝对路径或相对 base_dir 均可。
# 换书务必改成新书专属名（如 _driver_log_<书名>.json），否则会误读旧书进度。
log = "D:/project/NovelAgent/小说/_driver_log_jipin.json"

# ---------------------------------------------------------------------------
# [run] 续写节奏与上限（★ 可按新书体量调整）
# ---------------------------------------------------------------------------
[run]
# 单批增量上限（字）：累计写这么多字就正常退出，方便分批续写、抗沙箱超时。
# 重新运行脚本会从日志断点继续，不会从头写。
run_target_chars = 50000

# 安全硬上限（字）：极端兜底，正常情况下会在最后一弧写满时完结，不会触发此上限。
hard_cap_chars = 450000

# 章节间冷却（秒）：写前一睡，规避 LLM 服务商的 RPM 限流（智谱免费/按量账户常见）。
# 若换用不限流或额度高的模型，可设小（如 3~5）；若仍频繁 429，可加大。
cooldown_sec = 45

# 简单模式章节上限：>0 时启用「写到 N 章即完结」的简化完结判定（忽略支线配置）。
# 若配置了下方 [arcs]，本项会被忽略（以支线完结为准）。默认 0 = 不启用。
max_chapters = 0

# ---------------------------------------------------------------------------
# [arcs] 支线（卷）规划 —— 仅「支线模式」需要（★ 换书按需改）
# ---------------------------------------------------------------------------
# 说明：ids 与 per_arc_chapters 必须一一对应、长度相等。
# 驱动按 ids 顺序推进支线；写完【最后一条支线】即视为小说正式完结。
# 若你的新书没有明确的「卷/支线」概念，直接删掉整个 [arcs] 段，
# 并在 [run] 里设置 max_chapters > 0 走简单模式即可。
[arcs]
ids = [
    "S01_情感清算_前缘断绝",
    "S02_医馆崛起_积累功德",
    "S03_身世揭秘_医典之谜",
    "S04_正邪博弈_宗门围剿",
    "S05_终极清算_仙尊登临",
]
# 每条支线规划的章节数（与上面 ids 一一对应）。最后一弧写满即完结。
per_arc_chapters = [25, 17, 2, 2, 3]

# ---------------------------------------------------------------------------
# [adjust] 一致性演化频率（可按新书调整）
# ---------------------------------------------------------------------------
[adjust]
# 每隔多少章执行一次 adjust-relation / adjust-route（让关系网/路线随剧情演化）。
# 设 0 可关闭 adjust（更快、更省配额，但关系网/路线不会随写随更新）。
every = 5

# 从第几条支线（0-based）起，adjust 意图切换为「收官/收束伏笔」语气。
# 仅支线模式生效；设为很大的数（如 999）可关闭该语气切换。
tail_from_arc_index = 3

# ---------------------------------------------------------------------------
# [novel_complete] 完结后自动操作（一般不改）
# ---------------------------------------------------------------------------
[novel_complete]
# 完结后自动导出 TXT 成书。
export_txt = true
# 完结后自动生成 dashboard 可视化。
dashboard = true
