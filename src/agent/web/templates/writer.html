{% extends "base.html" %}
{% block title %}{{ name }} · 实时写作间{% endblock %}
{% block content %}
<div class="page-head">
  <h1>实时写作间：{{ name }}</h1>
  <p class="muted">写章过程通过 SSE 实时回传进度与成本。下方"写下一章"会弹出实时控制台。</p>
</div>

<section class="card">
  <h2>写下一章</h2>
  <div class="actions-row">
    <label>引擎模式
      <select id="w-mode">
        <option value="auto">auto（自主 Agentic Loop）</option>
        <option value="heavy">heavy（更严）</option>
        <option value="light">light（更轻）</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="w-strict" checked /> 严格质量审查</label>
    <button class="btn primary" onclick="writeChapter()">写下一章</button>
  </div>
  <div id="cost-box" class="cost-box"></div>
</section>

<section class="card">
  <h2>已生成章节</h2>
  <div id="chapters"><p class="muted">加载中…</p></div>
</section>
{% endblock %}
{% block scripts %}
<script>
  function renderChapters(list) {
    const box = document.getElementById('chapters');
    if (!list.length) { box.innerHTML = '<p class="muted">还没有章节，点上方"写下一章"。</p>'; return; }
    box.innerHTML = '<ul class="chapter-list">' + list.map(c =>
      `<li><a href="/p/{{ name }}/file?path=${encodeURIComponent(c.rel)}">第 ${c.num} 章 · ${c.name}</a>
       <span class="muted small">${(c.size/1024).toFixed(1)} KB</span></li>`).join('') + '</ul>';
  }
  function loadChapters() {
    fetch('/api/chapters/{{ name }}').then(r => r.json()).then(renderChapters);
  }
  function writeChapter() {
    const mode = document.getElementById('w-mode').value;
    const strict = document.getElementById('w-strict').checked;
    const argv = ['--mode', mode];
    if (!strict) argv.push('--no-strict-review');
    const c = startRunConsole('写下一章（' + mode + '）');
    runCommand('{{ name }}', 'write', argv, c, (d) => {
      loadChapters();
      if (d.summary && d.summary.cost_alert) {
        const a = d.summary.cost_alert;
        document.getElementById('cost-box').innerHTML =
          `<span class="badge">成本预警：${a.level || a.message || '—'}</span>`;
      }
    });
  }
  loadChapters();
</script>
{% endblock %}
