{% extends "base.html" %}
{% block title %}{{ name }} · 文件{% endblock %}
{% block content %}
<div class="page-head">
  <h1>文件浏览：{{ name }}</h1>
  <p class="muted">项目内所有 markdown 文档（不含 .state 内部文件）。</p>
</div>
<section class="card">
  {% if files %}
  <ul class="file-list">
    {% for f in files %}
    <li>
      <a href="/p/{{ name }}/file?path={{ f.rel | urlencode }}">{{ f.rel }}</a>
      <span class="muted small">{{ (f.size/1024)|round(1) }} KB</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="muted">暂无文件。</p>
  {% endif %}
</section>
{% endblock %}
