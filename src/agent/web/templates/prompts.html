{% extends "base.html" %}
{% block title %}提示词面板 · NovelAgent Web{% endblock %}
{% block content %}
<div class="page-head">
  <h1>提示词版本面板</h1>
  <p class="muted">
    <code>prompts/</code> 目录下的 Markdown 提示词是单一真源：CLI 短进程按 mtime 改即生效，
    Web 长驻进程由后台线程每 5 秒轮询自动重载。改动 md 后也可在此手动刷新。
  </p>
</div>

<section class="card">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
    <h2 style="margin:0;">清单（{{ rows|length }} 个）</h2>
    <button class="btn"
            hx-post="/api/prompts/reload"
            hx-target="#prompts-table"
            hx-swap="outerHTML">重载缓存</button>
  </div>
  {% include "_prompts_table.html" %}
</section>
{% endblock %}
