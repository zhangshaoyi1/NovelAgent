[project]
name = "novel-agent"
version = "0.1.0"
description = "共创式小说写作 Agent - 设定集驱动的长篇一致性 + 剧集树 + 关系演化"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "novel-agent" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
# 本地 Embedding（EMBEDDING_PROVIDER=qwen_local，transformers 离线推理）。
# torch 在 Windows 上默认 PyPI 源即 CPU 版；需要 CUDA 版时：
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
local-embedding = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[project.scripts]
novel-agent = "agent.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# src 布局：Python 包位于 src/agent/ + src/llmagent/，pyproject.toml 在仓库根（agent/）。
[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "llmagent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "llmagent_tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E9（语法级错误）+ TID251 banned-api（lint 层红线，T2 三层之一）。
# 注意：F/E4/E7 存量问题较多，纳入基线前先清理，勿直接加入 select。
select = ["E9", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"openai".msg = "provider SDK 仅允许 agent/client/ 与 llmagent/gateway/ 引用（R1 红线）"
"ollama".msg = "provider SDK 仅允许 agent/client/ 与 llmagent/gateway/ 引用（R1 红线）"

[tool.ruff.lint.per-file-ignores]
# R1 白名单：网关边界层与测试
"src/llmagent/gateway/**" = ["TID251"]
"src/agent/client/**" = ["TID251"]
"tests/**" = ["TID251"]
"llmagent_tests/**" = ["TID251"]
